<!DOCTYPE html>
<html>

<head>
    <title>Login | Campus AI</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #020617, #001f1f);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        .box {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            width: 380px;
            box-shadow: 0 0 30px rgba(0, 255, 179, 0.15);
            border: 1px solid rgba(0, 255, 179, 0.2);
            animation: fadeIn 0.8s ease-out;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(to right, #00ffb3, #00c6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2rem;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border-radius: 10px;
            border: 1px solid #1e293b;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #00ffb3;
            box-shadow: 0 0 10px rgba(0, 255, 179, 0.2);
        }

        .password-box {
            position: relative;
            width: 100%;
        }

        .eye {
            position: absolute;
            right: 15px;
            top: 24px;
            cursor: pointer;
            color: #00ffb3;
            user-select: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(to right, #00ffb3, #00c6ff);
            color: #020617;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 179, 0.4);
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
        }

        a:hover {
            color: #00ffb3;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Sign In</h2>
        <p style="text-align: center; color: #94a3b8; font-size: 0.85rem; margin-top: -15px; margin-bottom: 20px;">
            Access your SRM Student Dashboard
        </p>

        <form action="/login" method="POST">
            <input type="email" name="email" placeholder="Institutional Email" required>

            <div class="password-box">
                <input type="password" id="password" name="password" placeholder="Password" required>
                <span class="eye" onclick="togglePassword()">👁️</span>
            </div>

            <button type="submit">Login to Campus AI</button>
        </form>

        <div class="footer-links">
            <a href="/register">Don't have an account? Create Account</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            var x = document.getElementById("password");
            if (x.type === "password") {
                x.type = "text";
            } else {
                x.type = "password";
            }
        }
    </script>

</body>

</html>
