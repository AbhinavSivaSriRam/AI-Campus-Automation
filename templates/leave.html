<!DOCTYPE html>
<html>

<head>
    <title>Leave Portal | Campus AI</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: white;
            min-height: 100vh;
        }

        .container {
            padding: 40px;
            max-width: 800px;
            margin: auto;
        }

        h2 {
            background: linear-gradient(to right, #00c6ff, #00ffb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2rem;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            background: #1e293b;
            color: white;
            border: 1px solid #334155;
            outline: none;
            box-sizing: border-box;
            font-size: 1rem;
            resize: vertical;
        }

        textarea:focus {
            border-color: #00ffb3;
        }

        button {
            margin-top: 15px;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(to right, #00c6ff, #00ffb3);
            color: #020617;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 179, 0.3);
        }

        table {
            width: 100%;
            margin-top: 30px;
            background: rgba(30, 41, 59, 0.5);
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background: linear-gradient(to right, #00c6ff, #00ffb3);
            color: #020617;
            padding: 15px;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-pending {
            color: #ffc107;
            font-weight: bold;
        }

        .status-approved {
            color: #00ffb3;
            font-weight: bold;
        }

        .status-rejected {
            color: #ff4444;
            font-weight: bold;
        }

        .back {
            margin-top: 30px;
            display: inline-block;
            color: #94a3b8;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            color: #00ffb3;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>📄 Leave Application</h2>
        <p style="color: #94a3b8;">Apply for leave or track your previous requests.</p>

        <form method="POST" action="/leave">
            <textarea name="reason" rows="4" placeholder="Enter your reason for leave (e.g., Medical, Family Event)"
                required></textarea>
            <button type="submit">Submit Application</button>
        </form>

        <h3>Application History</h3>
        <table>
            <thead>
                <tr>
                    <th>Reason</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for row in data %}
                <tr>
                    <td>{{ row[1] }}</td>
                    <td>
                        <span
                            class="{% if row[2] == 'Pending' %}status-pending{% elif row[2] == 'Approved' %}status-approved{% else %}status-rejected{% endif %}">
                            {{ row[2] }}
                        </span>
                    </td>
                </tr>
                {% endfor %}

                {% if not data %}
                <tr>
                    <td colspan="2" style="color: #64748b; padding: 20px;">No leave applications found.</td>
                </tr>
                {% endif %}
            </tbody>
        </table>

        <a href="/dashboard" class="back">⬅ Back to Dashboard</a>
    </div>
</body>

</html>
