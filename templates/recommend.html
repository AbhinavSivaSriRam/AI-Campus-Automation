<!DOCTYPE html>
<html>

<head>
    <title>AI Study Suggestion | Campus AI</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: white;
            padding: 20px;
        }

        .box {
            padding: 35px;
            border-radius: 20px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            text-align: center;
            width: 100%;
            max-width: 650px;
            box-shadow: 0px 0px 30px rgba(0, 255, 179, 0.15);
            border: 1px solid rgba(0, 255, 179, 0.2);
            animation: fadeIn 0.8s ease-out;
        }

        h2 {
            margin-top: 0;
            background: linear-gradient(to right, #00c6ff, #00ffb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px;
        }

        .message {
            margin-top: 25px;
            font-size: 16px;
            line-height: 1.8;
            text-align: left;
            background: rgba(15, 23, 42, 0.6);
            padding: 25px;
            border-radius: 12px;
            border-left: 4px solid #00ffb3;
            max-height: 450px;
            overflow-y: auto;
            white-space: pre-wrap;
            /* Preserves the AI's structure */
        }

        /* Custom scrollbar */
        .message::-webkit-scrollbar {
            width: 6px;
        }

        .message::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            border-radius: 10px;
            text-decoration: none;
            background: linear-gradient(to right, #00c6ff, #00ffb3);
            color: #020617;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 255, 179, 0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>🤖 AI Personal Coach</h2>
        <p style="color: #94a3b8; font-size: 14px;">Analyzing Student ID: RA2311026010524</p>

        <div class="message" id="ai-advice">
            {{ message }}
        </div>

        <a href="/dashboard">⬅ Back to Dashboard</a>
    </div>

    <script>
        // Formatting script to handle Bold and Lists from Gemini
        const adviceBox = document.getElementById('ai-advice');
        if (adviceBox) {
            let content = adviceBox.innerHTML;
            content = content.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>'); // Bold
            content = content.replace(/\* /g, '• '); // Bullets
            adviceBox.innerHTML = content;
        }
    </script>
</body>

</html>
