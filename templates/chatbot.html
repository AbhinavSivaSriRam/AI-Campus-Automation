<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SRM Intelligence Terminal | Campus AI</title>
    <!-- Marked.js for rendering AI markdown correctly -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #00ffb3;
            --secondary: #00c6ff;
            --bot-bg: #1e293b;
            --user-gradient: linear-gradient(135deg, #00c6ff, #0072ff);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Header --- */
        .header {
            padding: 20px;
            text-align: center;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* --- Chat Display --- */
        .chat-box {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .bubble {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 20px;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user {
            align-self: flex-end;
            background: var(--user-gradient);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 10px 20px rgba(0, 114, 255, 0.2);
        }

        .bot {
            align-self: flex-start;
            background: var(--bot-bg);
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Markdown Styling inside bot messages */
        .bot code {
            background: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--primary);
        }

        .bot pre {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            overflow-x: auto;
            border: 1px solid #334155;
        }

        /* --- Input Zone --- */
        .input-box {
            padding: 25px;
            background: rgba(2, 6, 23, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 15px;
        }

        input {
            flex: 1;
            padding: 16px;
            border-radius: 15px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            outline: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 255, 179, 0.2);
        }

        button {
            padding: 0 30px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(to right, var(--secondary), var(--primary));
            cursor: pointer;
            font-weight: 800;
            color: #020617;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .back-btn {
            position: absolute;
            top: 22px;
            left: 20px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 10;
        }

        .back-btn:hover {
            color: var(--primary);
        }
    </style>
</head>

<body>

    <a href="/dashboard" class="back-btn">⬅ TERMINAL DASHBOARD</a>

    <div class="header">SRM Campus Intelligence</div>

    <div class="chat-box" id="chat-box">
        <!-- Default Welcome -->
        <div class="bubble bot">
            Hello! I am your <b>Campus AI</b>. I have access to your schedule and academic records. How can I assist you
            today?
        </div>

        {% if user_query %}
        <div class="bubble user">{{ user_query }}</div>
        {% endif %}

        {% if response %}
        <div class="bubble bot" id="raw-response" style="display: none;">{{ response }}</div>
        <div class="bubble bot" id="formatted-response">
            <span id="typing-text"></span>
        </div>
        {% endif %}
    </div>

    <form method="POST" action="/chatbot" class="input-box" id="chat-form">
        <input type="text" name="msg" id="msg-input" placeholder="Query the Campus Intelligence..." required
            autocomplete="off">
        <button type="submit" id="send-btn">Send</button>
    </form>

    <script>
        const chatBox = document.getElementById('chat-box');
        const rawRes = document.getElementById('raw-response');
        const formattedRes = document.getElementById('formatted-response');
        const typingSpan = document.getElementById('typing-text');

        // Render Markdown for the AI Response
        if (rawRes) {
            const markdownText = rawRes.innerText;

            // 1. Handle Typing Effect
            let i = 0;
            const speed = 10; // ms
            function typeWriter() {
                if (i < markdownText.length) {
                    typingSpan.innerHTML += markdownText.charAt(i);
                    i++;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    setTimeout(typeWriter, speed);
                } else {
                    // 2. Once finished typing, render full Markdown (for code blocks/bold)
                    formattedRes.innerHTML = marked.parse(markdownText);
                }
            }
            typeWriter();
        }

        // Form Submission Feedback
        document.getElementById('chat-form').onsubmit = function () {
            const btn = document.getElementById('send-btn');
            btn.innerHTML = "SYSTEM BUSY...";
            btn.style.opacity = "0.5";
            btn.disabled = true;
        };

        // Final scroll check
        chatBox.scrollTop = chatBox.scrollHeight;
    </script>
</body>

</html>
